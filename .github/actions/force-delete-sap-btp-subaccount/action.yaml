name: 'Force Delete SAP BTP Subaccount'
description: 'Action for force deleting SAP BTP subaccount'

inputs:
  btp_subaccount_id:
    description: 'btp subaccount id. When empty, there is nothing to delete and the action succeeds without calling the BTP CLI.'
    required: false
  btp_backend_url:
    description: 'btp backend url'
    required: true
  btp_user:
    description: 'btp user'
    required: true
  btp_password:
    description: 'btp password'
    required: true
  btp_global_account:
    description: 'btp global account'
    required: true
  btp_idp_tenant:
    description: 'btp idp tenant'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install BTP CLI
      shell: bash
      run: |
        sudo ln -sf bash /bin/sh
        curl -LJO https://tools.hana.ondemand.com/additional/btp-cli-linux-amd64-latest.tar.gz --cookie "eula_3_2_agreed=tools.hana.ondemand.com/developer-license-3_2.txt"
        tar -zxf btp-cli-linux-amd64-latest.tar.gz --strip-components=1 -C /usr/local/bin
        rm -f btp-cli-linux-amd64-latest.tar.gz
        echo "BTP CLI downloaded into /usr/local/bin/btp"
    - name: Force delete btp resources
      shell: bash
      run: "${{ github.action_path }}/force_delete_subaccount.sh"
      env:
        BTP_SUBACCOUNT_ID: ${{ inputs.btp_subaccount_id }}
        BTP_BACKEND_URL: ${{ inputs.btp_backend_url }}
        BTP_USER: ${{ inputs.btp_user }}
        BTP_PASSWORD: ${{ inputs.btp_password }}
        BTP_IDP_TENANT: ${{ inputs.btp_idp_tenant }}
        BTP_GLOBAL_ACCOUNT: ${{ inputs.btp_global_account }}
