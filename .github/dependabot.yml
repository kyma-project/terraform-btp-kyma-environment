# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "/tests/btp-e2e-test"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "tf"
      include: "scope"
    groups:
      btp:
        patterns:
          - "SAP/btp"
      terracurl:
        patterns:
          - "devops-rob/terracurl"
      http:
        patterns:
          - "hashicorp/http"
  # The examples and .github/actions/create-sap-btp-kyma deliberately declare no
  # provider version constraints, so there is nothing here for Dependabot to bump:
  # they consume this module from `main` and inherit its constraints. Do not add a
  # terraform entry for those directories. A group spanning /.github/ can never open
  # a PR -- GitHub grants the `workflows` write scope only to the github-actions
  # ecosystem, so PR creation is refused with 400 "invalid or unauthorized changes",
  # reported as `dependency_file_not_supported`.
  # See https://github.com/dependabot/dependabot-core/issues/15237
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(gha)"
      include: "scope"
